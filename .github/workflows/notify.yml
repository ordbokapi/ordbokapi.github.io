name: Notify subscribers

on:
  workflow_run:
    workflows: ["Publish"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    outputs:
      has_new_post: ${{ steps.detect.outputs.has_new_post }}
      title: ${{ steps.detect.outputs.title }}
      url: ${{ steps.detect.outputs.url }}
      summary: ${{ steps.detect.outputs.summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Detect new posts
        id: detect
        run: |
          new_posts=$(git diff-tree --no-commit-id --name-status -r HEAD | \
            grep -E '^A.*content/posts/[0-9]{4}-[0-9]{2}-[0-9]{2}-.*\.md$' | \
            awk '{print $2}')

          if [ -z "$new_posts" ]; then
            echo "No new posts found"
            echo "has_new_post=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          post_file=$(echo "$new_posts" | sort -r | head -1)
          echo "Found new post: $post_file"

          title=$(sed -n 's/^title: *"\?\([^"]*\)"\?$/\1/p' "$post_file" | head -1)
          summary=$(sed -n "s/^summary: *['\"]\\(.*\\)['\"]$/\\1/p" "$post_file" | head -1)
          date=$(sed -n 's/^date: *\(.*\)$/\1/p' "$post_file" | head -1)

          filename=$(basename "$post_file" .md)
          date_part=$(echo "$filename" | grep -oP '^\d{4}-\d{2}-\d{2}')
          slug=$(echo "$filename" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
          url_date=$(echo "$date_part" | sed 's/-/\//g')
          url="https://ordbokapi.org/blogg/${url_date}/${slug}/"

          post_epoch=$(date -d "$date_part" +%s 2>/dev/null || echo 0)
          now_epoch=$(date +%s)
          age_hours=$(( (now_epoch - post_epoch) / 3600 ))

          if [ "$age_hours" -gt 48 ]; then
            echo "Post is older than 48 hours ($age_hours h), skipping notification"
            echo "has_new_post=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_new_post=true" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  notify:
    runs-on: ubuntu-latest
    environment: subscriber-notification
    needs: detect
    if: needs.detect.outputs.has_new_post == 'true'

    steps:
      - name: Notify mailer
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://blog-api.ordbokapi.org/new-post" \
            -H "Authorization: ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "${{ needs.detect.outputs.title }}" \
              --arg url "${{ needs.detect.outputs.url }}" \
              --arg summary "${{ needs.detect.outputs.summary }}" \
              '{title: $title, url: $url, summary: $summary}')")

          echo "Mailer responded with: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "::error::Mailer API returned $response"
            exit 1
          fi
