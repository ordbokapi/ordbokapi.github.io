query NorseOriginNouns {
  articles(
    dictionaries: [Nynorskordboka]
    filter: {
      wordClass: { eq: Substantiv }
      etymologyLanguage: { eq: Norroent }
    }
    first: 50
  ) {
    totalCount
    facets {
      gender {
        value
        count
      }
    }
    edges {
      node {
        id
        lemmas {
          lemma
        }
        gender
      }
    }
  }
}
