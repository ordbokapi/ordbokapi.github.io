query NorseOriginNouns {
  articles(
    dictionaries: [Nynorskordboka]
    filter: { wordClass: Substantiv, etymologyLanguage: Norroent }
    first: 50
  ) {
    totalCount
    facets {
      gender {
        value
        count
      }
    }
    edges {
      node {
        id
        lemmas {
          lemma
        }
        gender
      }
    }
  }
}
